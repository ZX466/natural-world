name: CI

# 每提交门禁（依赖/配置/文档域 — cline TASK-002）
# 对应 DESIGN.md §16 测试分级：CI 只跑 T1/T2/T3（无 LLM，秒级）；
# T4（真模型出戏探针）与 T5（golden 场景）进 nightly，不进本工作流。
# 性能基准（bench）同理不进本工作流：`-m "not bench"`，见 nightly-bench.yml。
#
# 平台选 ubuntu-latest：uv.lock 为通用锁（无平台专属钉死），lint/类型/单测跨平台等价，
# Linux runner 更快更省。若后续需要验证 Windows 专属行为（§4「Windows 无 uvloop」等），
# 再加一个 windows-latest job 即可，不要改动本 job 的检查项。
#
# 网络：GitHub runner 直连 PyPI/npm，无需代理；本地推送 GitHub 走 127.0.0.1:7897（GIT-SETUP.md）。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python（锁校验 / ruff / pyright / pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 校验锁文件与 pyproject 一致（uv.lock 可复现）
        run: uv lock --check

      - name: 同步虚拟环境（严格按锁文件，CI 不解析新版本）
        run: uv sync --frozen

      - name: ruff check（含 C5 守卫：banned-api 禁 random / uvloop）
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: pyright（类型）
        run: uv run pyright

      - name: pytest（T1/T2/T3；排除 bench —— 性能基准进 nightly）
        run: uv run pytest -m "not bench"

      - name: pytest T3 门禁（对抗样本断言，独立红灯信号）
        run: |
          # codex 的 test_t3_gate.py 无 `t3` marker（默认随单测 `-m "not bench"` 一起跑，
          # codex 建议不新增 job）。此处按【文件路径】选择，把门禁提升为命名独立信号。
          # 若改用 `-m t3`，因该文件无 marker 会永久收集 0 用例（退出码 5）→ 假绿灯，故不用。
          if [ ! -f sim/tests/test_t3_gate.py ]; then
            echo "::warning::T3 门禁文件缺失（已随 codex S03 进 main，疑似被误删/改名）→ 跳过"
            exit 0
          fi
          set +e
          uv run pytest sim/tests/test_t3_gate.py
          code=$?
          # 文件在但收集到 0 用例（退出码 5，如误删用例/改名）留痕跳过，避免误红
          if [ "$code" -eq 5 ]; then
            echo "::warning::T3 门禁文件已存在但未收集到任何用例（检查文件内容）"
            exit 0
          fi
          exit $code

      - name: pytest T1 自我未知门禁（信息边界双路径采样，M2-S1）
        run: |
          # codex 的 test_t1_self_unknown.py 无专属 marker（随 `-m "not bench"` 全量跑），
          # 按【文件路径】选择，把 M2-S1 自我未知信息边界门禁提升为独立命名信号
          # （沿用 test_t3_gate.py 做法，避免日后加 marker 被静默排除出 CI）。
          if [ ! -f sim/tests/test_t1_self_unknown.py ]; then
            echo "::warning::T1 自我未知门禁文件缺失（M2-S1 交付，疑似被误删/改名）→ 跳过"
            exit 0
          fi
          set +e
          uv run pytest sim/tests/test_t1_self_unknown.py
          code=$?
          # 文件在但收集到 0 用例（退出码 5）留痕跳过，避免误红
          if [ "$code" -eq 5 ]; then
            echo "::warning::T1 自我未知门禁文件已存在但未收集到任何用例（检查文件内容）"
            exit 0
          fi
          exit $code

      - name: pytest M1 指标跑分（差事 100% / P95<8s / <2k tok / 出戏 100%）
        run: |
          # TASK-004 P05：M1 四指标验收跑分（C06-⑥，`5c08c74`）。假 LLM 零网络，纯 T1，秒级。
          # 按【文件路径】选择：该文件无专属 marker（随 `-m "not bench"` 全量跑），
          # 按路径可保证即使日后给它加 marker 或改 addopts，也不会被静默排除出 CI。
          uv run pytest sim/tests/test_m1_metrics.py

      - name: pytest T1 L1 动作白名单门禁（M2-S2）
        run: |
          # codex 的 test_t1_l1_whitelist.py 无专属 marker（随 `-m "not bench"` 全量跑），
          # 按【文件路径】选择，把 M2-S2 L1 动作白名单门禁提升为独立命名信号
          # （沿用 test_t3_gate.py / test_t1_self_unknown.py 做法，防静默排除）。
          if [ ! -f sim/tests/test_t1_l1_whitelist.py ]; then
            echo "::warning::T1 L1 白名单门禁文件缺失（M2-S2 交付，疑似被误删/改名）→ 跳过"
            exit 0
          fi
          set +e
          uv run pytest sim/tests/test_t1_l1_whitelist.py
          code=$?
          # 文件在但收集到 0 用例（退出码 5）留痕跳过，避免误红
          if [ "$code" -eq 5 ]; then
            echo "::warning::T1 L1 白名单门禁文件已存在但未收集到任何用例（检查文件内容）"
            exit 0
          fi
          exit $code

      - name: pytest M2 指标跑分（占位 — 等 M2 交付后按文件路径填实）
        # M2-C1（cline，2026-09-21）：M2 量化验收的命名门禁**占位步骤**。
        # timeout 是刻意设置的护栏，理由见下（604,800 tick 量纲）——不是随手写的数。
        timeout-minutes: 15
        run: |
          # 纪律与 T3 / M1 同源：只按【文件路径】选择，不用 `-m xxx`
          # （marker/addopts 一变就会把门禁静默排除成假绿灯 —— P04 教训）。
          #
          # 为什么是「占位」而不是写死一个路径：
          #   DESIGN §10「1 tick = 1 游戏秒」⇒ 7 游戏日 = 604,800 tick。完整验收
          #   「50 NPC × 7 游戏日自转无崩溃」**不属于每提交 CI**（timeout-minutes: 15
          #   即这道护栏）；完整跑与 M2 红线一律接 nightly-bench.yml，红线唯一真相源
          #   = sim/tests/bench/thresholds.py（pi 维护）。故本步骤只接
          #   「CI 级缩样/采样」文件（无 LLM，秒级~分钟级）。
          #
          # 已由他域交付、**不在此重复接**的 M2 门禁（同一门禁不两处维护，防漂移）：
          #   - sim/tests/test_t1_self_unknown.py（codex M2-S1：自我未知/信息边界双路径采样；
          #     其分支已自带同款文件路径步骤，收编后与本步骤并存不冲突）
          #   - sim/tests/test_persistence_m2.py（opencode M2-D1：NPC 完整属性/熵增，纯 T1、
          #     秒级，随 `-m "not bench"` 全量跑，无需独立命名步骤）
          #
          # 填实动作（M2 验收跑分落库后由 cline 做）：glob 换显式文件路径、步骤名去掉「占位」、
          #   同步 docs/README.md §5 与 docs/dev-workflow.md §3 的实测数字。
          shopt -s nullglob
          files=(sim/tests/test_m2_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::M2 指标占位步骤：未找到 sim/tests/test_m2_*.py（M2 验收跑分尚未落库）→ 本步骤当前不构成门禁；落库后自动生效，请届时按本步骤注释填实路径"
            echo "sim/tests/ 现状（*.py）："
            for f in sim/tests/*.py; do echo "  ${f#sim/tests/}"; done
            exit 0
          fi
          echo "选中文件（按文件路径接法）：${files[*]}"
          set +e
          # 显式排除 bench：性能红线是抖动域，属 nightly（见本文件头注原则）。
          # 若整个文件被 marker 排除 → 退出码 5 → 下方留痕 warning（说明它该接 nightly）。
          uv run pytest -m "not bench" "${files[@]}"
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "::warning::M2 指标文件已存在但未收集到任何用例（全部被 marker 排除 / 文件为空，检查命名与 marker）"
            exit 0
          fi
          exit $code

  frontend:
    name: 前端（锁 / tsc / eslint / vitest / prettier）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24：kilo 的 tools/gen-protocol.ts 以 `node` 直接运行 .ts（无旗标类型剥离需 ≥23.6；
          # 本地开发环境 24.19.0 实测通过）。降级到 22 会让 gen:protocol 系列脚本失效。
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 按锁文件安装（ci 不解析新版本）
        run: npm ci --no-audit --no-fund

      - name: gen:protocol 漂移守卫（shared/protocol.ts 必须与 openapi.json 一致）
        run: node tools/gen-protocol.ts --check

      - name: tsc --noEmit（类型）
        run: npx tsc --noEmit

      - name: eslint
        run: npx eslint .

      - name: prettier --check
        run: npx prettier --check .

      - name: vitest
        run: npx vitest run --passWithNoTests