name: T4 Nightly（真模型出戏探针）

# DESIGN §16：T4 = 出戏探针 + 意愿抱怨合规（「是不是AI」「重来一次」「谁指使你」…），
# 真模型、**锁定模型版本**；§16 铁律「真模型测试进 nightly 不进 CI：烧钱且抖动」
# ——故本工作流**不进 `ci.yml`**（纪律同 ci.yml 头注；本文件不提供每提交门禁）。
# 能力域：配置/CI = cline（m4-plan §4/§6 裁 14 第 4 条已裁「T4 接线归 cline」）；探针集 = codex。
# 模型 id **硬编码在本文件 env，不进代码**（§16 锁版本防静默回归）：T4_MODEL。
#
# ===== 2026-09-27 用户改约存照：T4 = 本地真模型探针一轮 = 等效验收 =====
# 裁决：**不建 GitHub secret `T4_MODEL_API_KEY`**（key 只经本地环境变量，见
# `docs/dev-workflow.md` §3「T4 本地探针一轮」，三件套 T4_MODEL / T4_MODEL_BASE_URL /
# T4_MODEL_API_KEY，PowerShell 会话内有效，不入库不入日志）。
# 故本文件的 `schedule` **已注释**（真模型自动跑＝每夜烧钱，改约后由人手动跑一轮），
# `workflow_dispatch` **保留**——将来若恢复 secret 与自动跑，取消 schedule 注释即可。
# env 里的 T4_MODEL / T4_MODEL_BASE_URL 与本地跑法**同值**（锁版本口径不许两处漂移）；
# **api_key 绝不进本文件**（下方 env 与 steps 中均无 key，只有可选的本地注入点说明）。

on:
  # schedule:
  #   # 改约前：UTC 19:30 = 北京 03:30；与 nightly-bench.yml（UTC 18:00 / 北京 02:00）错开，
  #   # 避免同刻挤兑 runner。2026-09-27 用户改约本地跑法后注释掉（不建 secret ⇒ 不自动烧钱）。
  #   # 恢复条件：secret `T4_MODEL_API_KEY` 重新配好 + 用户确认恢复每夜自动跑。
  #   - cron: "30 19 * * *"
  workflow_dispatch:

env:
  # 与 docs/dev-workflow.md §3 本地跑法同值（锁版本：模型 id 变更即需两处同步改）。
  T4_MODEL: Deepseek-v4-flash
  # OpenAI 兼容国内直连端点（改约后本地跑法用同一端点；不走 127.0.0.1:7897——该代理仅 github.com 域生效）。
  T4_MODEL_BASE_URL: https://chatapi.weixin.qq.com/openai/v1

jobs:
  t4:
    name: T4 出戏探针（真模型 · 锁版本）
    runs-on: ubuntu-latest
    # 护栏：真模型调用有墙钟上限；探针集规模定标后再调整（§15 成本治理：监控先行、阈值后调）
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 同步虚拟环境（严格按锁文件）
        run: uv sync --frozen

      - name: 记录模型锁版本证据（§16 锁版本：模型 id 变更即需显式改本 workflow env）
        run: |
          mkdir -p t4-results
          {
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner: ubuntu-latest"
            echo "nproc: $(nproc)"
            echo "model_id: ${T4_MODEL}"
            echo "base_url: ${T4_MODEL_BASE_URL}"
            echo "python: $(uv run python -V)"
          } > t4-results/model-lock.txt
          cat t4-results/model-lock.txt

      - name: 端点就绪检查（改约本地后：不再期待 secret，只报缺件）
        # 2026-09-27 改约：T4 走**本地**环境变量，本 workflow 不再注入 `T4_MODEL_API_KEY`，
        # 也不建 GitHub secret。故本 step **不判 secret 就绪**（旧口径「secret 未配置则探针阶段跳过」
        # 已作废——改约后本就没有 secret 这回事，别把「没 secret」再当成可解释的跳过理由）。
        # 这里只报**必填项**（模型 id / 端点）是否齐备，两者都来自本文件 env（锁版本，改约后已填）。
        # 缺任一项即硬失败：那是本文件配置漂移，不是「预期行为」，不能被误读成「探针全绿」。
        run: |
          if [ -z "${T4_MODEL}" ] || [ -z "${T4_MODEL_BASE_URL}" ]; then
            echo "::error::T4 必填 env 缺失（T4_MODEL / T4_MODEL_BASE_URL）——改约后这两项须常驻本 workflow env"
            exit 1
          fi
          echo "::notice::模型锁版本：${T4_MODEL} @ ${T4_MODEL_BASE_URL}（值非敏感）"
          echo "### T4 Nightly（2026-09-27 改约：本地真模型探针一轮）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 本工作流**不注入 api_key**（不建 GitHub secret；key 只经本地环境变量）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 当前验收口径＝**本地跑一轮** \`pytest -m t4\`（见 docs/dev-workflow.md §3）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 探针集待 codex M4-S7 落 \`sim/tests/test_t4_probes.py\`（下方探针步骤仍为注释态）" >> "$GITHUB_STEP_SUMMARY"

      # ===== TODO(codex M4-S7 交付后接)：T4 探针步骤 =====
      # 探针集：codex M4-S7 `sim/tests/test_t4_probes.py`（**改约后本地跑法为主路径**，见
      # `docs/dev-workflow.md` §3「T4 本地探针一轮」：三件套 env + `pytest -m t4`）。
      # 本 step 保持注释态——**不执行任何真模型调用**（零烧钱）。何时接入由 Claude 裁：
      #   若维持「本地跑一轮」验收口径，本 step 可长期注释（workflow 只作配置存照 + 端点检查）；
      #   若将来恢复 secret + 每夜自动跑，再取消注释并把 key 改回 `${{ secrets.T4_MODEL_API_KEY }}`。
      # 接线约定不变（探针落地后照此替换本段）：
      #   1. `pytest.ini` 已有 `t4` marker（--strict-markers 要求先注册，见本轮 cline 提交）；
      #   2. 探针文件落 `sim/tests/test_t4_*.py`（**文件路径 + marker 双纪律**，不靠 -m 单门禁）；
      #   3. 命令形：`uv run pytest -m t4 --junitxml=t4-results/t4.xml`（结果随下方 artifact 归档）；
      #   4. 探针必须断言「零直陈出戏命中」——命中即红（§16 T4 内容 + §19 抱怨不指向外部命令源）；
      #      **inconclusive 留人工复核**，不得当绿（判读表见 docs/dev-workflow.md §3）；
      #   5. 模型/温度/词面扫描全部读 `T4_MODEL` / `T4_MODEL_BASE_URL` 等 env，
      #      **不得在测试里硬编码模型 id**。
      # 本 step 在探针交付前保持注释态——不执行任何真模型调用（零烧钱）。

      - name: "归档结果（model-lock + 探针 junit；`if: always()` 保证红灯也留证据）"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t4-result
          path: t4-results/
          if-no-files-found: warn

      - name: 失败通知（写 step summary + 注解；不吞失败）
        if: failure()
        run: |
          echo "### T4 Nightly 失败" >> "$GITHUB_STEP_SUMMARY"
          echo "- 模型：${T4_MODEL}（锁版本口径，见 §16）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 诊断：先看 t4-result artifact 的 model-lock.txt 与探针 junit" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::T4 nightly 失败（模型 ${T4_MODEL}）——详见 step summary 与 t4-result artifact"