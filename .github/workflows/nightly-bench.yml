name: Nightly Bench

# 性能基准（性能域 pi 的约束：bench 不进每提交 CI，见 docs/perf/bench-plan.md §0）
# - 每提交 CI：ci.yml 用 `-m "not bench"` 明确排除
# - 本工作流：每天固定时刻 + 手动触发，跑 `-m bench` 并归档结果
#
# 阈值口径：bench-plan §3 要求记录机器档位（CPU 型号/核数/Python 版本）后再比对，
# 故结果 JSON 与机器信息一并上传，不做跨机器硬断言（runner 机型与开发机不同）。
#
# 阈值来源（单一真相源）：`sim/tests/bench/thresholds.py` —— 本 yml **不复制阈值表**，
# 避免同一红线两处维护而漂移（历史教训：codex S03 无 marker 时 `-m t3` 曾成假门禁）。
# - 感知传播红线 `PERCEPTION_TICK_LIMIT_MS = 3.6ms`（C06-③ 真实引擎合入后修订；
#   budget.md §2.5 的 3.00ms 仍是预算目标值，3.6 = 实测 +20% 余量）
# - 判定口径：**暖态中位**（`warmup_rounds=1` + median，`harness.assert_median_threshold`）——
#   冷启动首轮（LOS 对称缓存未预热，7.6–8.2ms）不得经 mean 把感知拉过红线（pi F06 裁决）
# - LLM 预取调度 `LLM_SCHED_TICK_LIMIT_MS = 0.20ms`（仅 tick 内确定性部分；异步推理不进 tick）
#
# M2 红线接入点（cline M2-C1 留接口；数值由性能域给，本 yml 不复制）：
# 1. 已就位（pi M2-P1，分支 ZX466/pi `adaf0c5`，待 Claude 收编）：
#    `sim/tests/bench/thresholds.py` 新增 5 常量 —— `L1_UTILITY_TICK_LIMIT_MS = 6.0`（50 NPC 每 tick）/
#    `L1_UTILITY_PER_NPC_LIMIT_MS = 0.12`（单 NPC） / `L1_OFFLINE_FALLBACK_LIMIT_MS = 0.20`（LLM 断线降级）/
#    `SMELL_TICK_LIMIT_MS = 0.15`（嗅觉传播每 tick） / `SMELL_NAIVE_SENTINEL_MS = 3.0`（naive 哨兵，不卡预算）。
#    对应 bench 文件 `sim/tests/bench/test_bench_l1_utility.py` / `test_bench_smell.py` 随 `-m bench`
#    自动纳入本工作流 —— **无需改本 yml**；判定口径统一「暖态中位」（warmup_rounds=1 + median）。
# 2. M2 完整验收「50 NPC × 7 游戏日自转无崩溃」= 604,800 tick（DESIGN §10：1 tick = 1 游戏秒）：
#    **不进每提交 CI**（ci.yml 的 M2 占位步骤只接缩样/采样文件）。Claude 2026-09-21 裁决**方案 A**
#    （pi M2-P2 §4 提案）：完整跑进本工作流同 job 新 step（见下方「M2 7 日自转完整跑」），
#    环境门 PI_M2_FULL_SOAK=1 才跑；里程碑后转周频独立 workflow 时由 cline 迁出。
# 3. 机器档位口径不变：跨机器不硬断言绝对值，结果 JSON 与机器信息一并归档（见 §机器档位步骤）。

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00（避开白天开发高峰）
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  bench:
    name: pytest-benchmark（-m bench）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 同步虚拟环境（严格按锁文件）
        run: uv sync --frozen

      - name: 记录机器档位（bench-plan §3 口径要求；写入 docs/perf/runner.txt，属入库基线信息）
        run: |
          mkdir -p docs/perf
          {
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner: ubuntu-latest"
            echo "nproc: $(nproc)"
            echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
            echo "python: $(uv run python -V)"
            echo "uv: $(uv --version)"
          } > docs/perf/runner.txt
          cat docs/perf/runner.txt

      - name: 跑基准
        # perf/ 是运行时目录：`.gitignore` 只忽略 `perf/*.json`，而**目录本身不入库**（git 不跟踪空目录），
        # 故全新 checkout 下 `perf/` 不存在 → pytest-benchmark 收尾 `save_json` 抛
        # `FileNotFoundError: [Errno 2] No such file or directory: 'perf/bench.json'`（C5 根因：
        # 09-19/09-20/09-21 三次 nightly 全倒在本 step，测试本身全绿）。先建目录再跑；产物仍不入库，
        # 只随下方 artifact 归档。
        # PI_BENCH_ADVISORY=1（pi M2-P6，Claude 2026-09-22 裁决 1）：runner 是共享 4 核
        # （cline 取证 run 35816437844：边缘越线 2-9% 属调度噪声）→ 本 step 走 advisory 口径：
        # 越线 structlog warning 记录 + 继续跑完 + JSON 全量归档；硬断言只留定标机
        # （harness.advisory_mode 门只改「断不断言」，采集逻辑零改动）。
        # 回归判定据此转为「归档 + 相对基线漂移」（bench-plan §0 原意；见下方基线对比 step）。
        env:
          PI_BENCH_ADVISORY: "1"
        run: |
          mkdir -p perf
          uv run pytest -m bench --benchmark-json=perf/bench.json

      - name: M2 7 日自转完整跑（604,800 tick，里程碑期 nightly 接法）
        # pi M2-P2 §4 提案、Claude 2026-09-21 裁决采用**方案 A**：完整跑进 nightly 同 job
        # 新 step（里程碑期 nightly 有覆盖、快速暴露回归；里程碑后转周频独立 workflow，
        # 届时由 cline 迁出）。阈值唯一真相源仍 sim/tests/bench/thresholds.py，不复制。
        # 环境门 PI_M2_FULL_SOAK=1 才跑（默认 skip，见 test_bench_soak.py 完整跑用例），
        # 60 min 超时护栏：实测本机 100k tick ~83s，604,800 tick 预估 ~8-20 min，余量充足。
        timeout-minutes: 60
        run: uv run pytest sim/tests/bench/test_bench_soak.py::test_m2_full_7day_acceptance -q
        env:
          PI_M2_FULL_SOAK: "1"

      - name: 上传基线结果
        # `if: always()`：本 step 原来在「跑基准」失败时被跳过 → 四轮 nightly 全红且 artifact 0 份，
        # 诊断证据与 CI 档位实测数字全部丢失（C5 缺陷 2）。改成无论如何都归档：
        # 红灯时也要留下 perf/bench.json 与 runner.txt。
        # 同时把「记录机器档位」写出的 docs/perf/runner.txt 一并归档（bench-plan §3 要求基线
        # 记录机器档位；该文件只写在 CI 工作区、原先既不入库也不上传 = 档位信息随 run 蒸发），
        # 供性能域（pi）拿 CI 档位数字定标/放红线、并在 baseline 入库时记录档位头。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: |
            perf/
            docs/perf/runner.txt
          if-no-files-found: warn

      - name: runner 机型防漂检查（不一致 → **仅 warning，不判红**；判红语义仍只由下方 median:25% 决定）
        # 背景：GitHub `ubuntu-latest` 池**跨厂商且会漂**（近 4 轮实测 3×EPYC 7763 + 1×Xeon 8573C）。
        # 本工作流是**跨机相对漂移**判定，换机即可造成「假红」，也可能掩盖真回归。
        # 故基线**按机型分文件**，本 step 只做「机型是否与基线同档」的可见性：
        #   · 一致 → ::notice::
        #   · 不一致 → ::warning::（**绝不 exit 1**，不改变任何判红语义、不碰 thresholds）
        # 已知局限（登记在 baseline 的 open_items③）：落到别的机型时，本轮 median 与本基线**不可直接比较**。
        run: |
          BASE=docs/perf/baseline-epyc7763.json
          base_cpu=$(uv run python -c "import json;print(json.load(open('$BASE'))['machine_info']['cpu']['brand_raw'])" 2>/dev/null || echo "<读取失败>")
          now_cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//' || true)
          [ -z "$now_cpu" ] && now_cpu="<读取失败>"
          {
            echo "### runner 机型防漂检查"
            echo "- 基线文件：\`$BASE\`（machine_key=epyc7763）"
            echo "- 基线机型：$base_cpu"
            echo "- 本轮 runner：$now_cpu"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$base_cpu" = "$now_cpu" ]; then
            echo "::notice::机型一致：$now_cpu（本次 median 漂移可直接与基线比较）"
          else
            echo "::warning::runner 机型与基线不一致：当前『$now_cpu』vs 基线『$base_cpu』——本轮 median 漂移可能由换机引起而非代码回归；按裁 2x **只告警不判红**，判红仍只由 median:25% 决定（语义与阈值均未变更）"
            echo "- ⚠ 机型不一致：本次漂移数值**不可直接与本基线比较**（已知局限，见基线 open_items③）" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: 基线对比（CI 档位相对漂移，裁 4 / pi M3-P2② 落地）
        # 契约：阈值真相源唯一 = sim/tests/bench/thresholds.py（定标机硬断言），本 yml **不复制阈值**。
        # advisory 门（PI_BENCH_ADVISORY=1）下 runner 侧绝对越线不再是红灯信号 → CI 回归判定靠
        # 本 step 的**相对基线漂移**：docs/perf/baseline-epyc7763.json（**按机型分文件**；由性能域从首个
        # 全绿 run 入库，bench-plan §4.1 八步；现 59 行单一 provenance ＝ run 36580639759 @2026-09-29），
        # 逐 run 登记见该文件的 machine_info.baseline_meta.rows_provenance。
        # 25% = 覆盖 CI/本机档位比（~1.14-1.71 实测分布）+ 调度抖动；**不是新阈值**，勿抄进 thresholds。
        # 失败处置：先看是不是单轮被抢断（mean/median >2x → 重跑），再看是否定标机也越硬线（真回归）。
        # 本 step 的 env 必须与「跑基准」step 一致带 `PI_BENCH_ADVISORY: "1"`：缺它会让定标机绝对阈值
        # 在共享 runner 上重新变成硬断言（run 36494001567 的 4 条 AssertionError 即此因，与 25% 漂移无关），
        # 致本 step 长期红、bench-plan §4.1 触发前提 2「首个全绿 run」永不满足。已按**裁 28-E** 修复。
        env:
          PI_BENCH_ADVISORY: "1"
        run: |
          uv run pytest -q -m bench \
            --benchmark-compare=docs/perf/baseline-epyc7763.json \
            --benchmark-compare-fail=median:25%