# Alembic config (TASK-002 leftover)
#
# Usage (run from project root):
#   uv run alembic upgrade head
#   uv run alembic current
#   uv run alembic downgrade -1
#   uv run alembic revision --autogenerate -m "msg"
#
# env.py reads WORLD_DB_URL env var; default sqlite+aiosqlite:///world.db

[alembic]
script_location = sim/core/persistence/alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
