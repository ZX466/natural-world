; pytest 配置（依赖/配置域 — cline TASK-001）
; 测试分级 T1-T5 见 DESIGN.md §16；M0 只跑 T1/T2（无 LLM）。
[pytest]
minversion = 8.0
testpaths = sim/tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    t1: 不变量断言（因果/边界/经济/幻觉隔离/历史不可销毁/材料守恒），无 LLM，秒级
    t2: 回放确定性（seed + 事件日志 → 状态逐位一致），无 LLM
    t3: 闸门对抗样本（录制 fixture 回放）
    t4: 出戏探针 + 意愿抱怨合规（真模型；**每日 nightly 跑、锁定模型版本**，不进每提交 CI——见 .github/workflows/t4-nightly.yml 与 DESIGN §16）
    t5: golden 场景（10 种子 × 10 游戏日，断言宏观结果）
    bench: 性能基准（pytest-benchmark；nightly 跑 `-m bench`，每提交 CI 跑 `-m "not bench"`，见 docs/perf/bench-plan.md）
